name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Firebase Rules isolation tests
        run: npm run test:rules
      - name: Durable visible-flow transactions
        env:
          FIREBASE_ENFORCE_TENANT_LIFECYCLE: 'true'
        run: npx firebase-tools emulators:exec --project demo-hyperflow --only database --config firebase.test.json "node --import tsx --test tests/integration/phase06.test.ts"
      - name: Tenant credentials, workspace revisions and pagination
        run: npx firebase-tools emulators:exec --project demo-hyperflow --only database --config firebase.test.json "node --import tsx --test tests/integration/phase11.test.ts"

  integrated-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hyperflow
      - uses: actions/checkout@v4
        with:
          repository: JorianCunliffe/communications-service
          ref: c2a71d79739c7789c2fd52af61c85fe4a780509a
          path: communications
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve Replit mirror packages through the public registry
        working-directory: communications
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const entry of Object.values(lock.packages)) {
            if (entry.resolved?.startsWith('http://package-firewall.replit.local/npm/')) {
              if (!entry.integrity) throw new Error('Mirror package lacks integrity');
              entry.resolved = entry.resolved.replace('http://package-firewall.replit.local/npm/', 'https://registry.npmjs.org/');
            }
          }
          writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - run: npm ci
        working-directory: communications
      - name: Communications draft update tests
        run: node --test --test-reporter=spec test/mailboxDraftUpdate.test.js
        working-directory: communications
      - name: Communications core regression tests
        run: node --test --test-reporter=spec test/database.test.js test/transcripts.test.js test/context.test.js test/communications.test.js test/email.test.js test/emailPolicy.test.js test/mailbox.test.js test/callOutcome.test.js test/tools.test.js test/voiceTurns.test.js test/eventOutbox.test.js test/hyperflowScheduler.test.js test/memory.test.js test/security.test.js test/tenantClient.test.js test/contractFixtures.test.js
        working-directory: communications
      - name: Communications documentation contract
        run: node --test --test-reporter=spec test/documentation.test.js
        working-directory: communications
      - name: Communications suite contract
        run: node --test --test-reporter=spec test/suite.test.js
        working-directory: communications
      - run: npm ci
        working-directory: hyperflow
      - name: Pinned cross-service acceptance against isolated databases
        working-directory: hyperflow
        env:
          PHASE02_COMMUNICATIONS_CHECKOUT: ${{ github.workspace }}/communications
        run: npx --yes firebase-tools emulators:exec --project demo-hyperflow --only database --config firebase.test.json "node --import tsx --test --test-concurrency=1 tests/integration/*.test.ts"
