
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F5F5F7">
    <script>
      /* Resolve Light / Midnight before first paint to avoid a theme flash (mirrors lib/theme.ts). */
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('hyperflow.theme.v1') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#F5F5F7');
      })();
    </script>
    <title>HyperFlow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind-theme.js"></script>
    <style>
            body {
        overflow: hidden; /* Prevent body scroll, use app container */
      }
      .mindmap-container {
        cursor: grab;
        user-select: none;
      }
      .mindmap-container:active {
        cursor: grabbing;
      }
      /* Scrollbars and theme surfaces: styles/theme.css */

      /* PRINT STYLES */
      @media print {
        @page { size: landscape; margin: 0.5cm; }
        body { 
          background-color: white !important; 
          overflow: visible !important; 
          height: auto !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        #root, main, .mindmap-container {
          position: static !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          background: white !important;
        }
        /* Hide UI Elements */
        header, button, .print\:hidden {
          display: none !important;
        }
      }
    </style>
